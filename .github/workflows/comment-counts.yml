name: Comment Counts

# Refreshes data/comment-counts.json with the number of POSTED (moderation-cleared)
# comments on tracked regulations.gov dockets. Powers the closed-state count in the
# Public Comment CTA. Runs daily; keep it running ~30-60 days past a deadline because
# the posted count lags received for weeks on large dockets.
#
# Requires repo secret REGULATIONS_GOV_API_KEY (free: https://api.data.gov/signup/).

on:
  schedule:
    - cron: "17 9 * * *"   # daily, 09:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: comment-counts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch posted comment counts
        env:
          REGULATIONS_GOV_API_KEY: ${{ secrets.REGULATIONS_GOV_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.request, urllib.parse, urllib.error
          from datetime import datetime, timezone

          API = "https://api.regulations.gov/v4"
          KEY = os.environ.get("REGULATIONS_GOV_API_KEY", "").strip()
          PATH = "data/comment-counts.json"

          # The watch list is DERIVED from data/puzzles.json — adding a watched
          # rule is a data edit, and retiring one happens on its own:
          #   * a puzzle that isn't live is not watched
          #   * a rule with final_rule_url set is done; stop polling
          #   * a closed window stops being polled GRACE_DAYS after its deadline
          #     (posted counts lag received by weeks, hence the grace period)
          # Counts already written stay in the JSON, so a closed rule keeps
          # showing its final tally forever.
          GRACE_DAYS = 60
          MANIFEST = "data/puzzles.json"

          def watch_list():
              try:
                  puzzles = json.load(open(MANIFEST)).get("puzzles", [])
              except Exception as e:
                  print(f"::warning::Could not read {MANIFEST} ({e}); nothing to watch.")
                  return []
              now = datetime.now(timezone.utc)
              out, seen = [], set()
              for p in puzzles:
                  cta = p.get("comment_cta") or {}
                  doc = cta.get("count_document_id")
                  if not doc or doc in seen:
                      continue  # several puzzles can cover the same rule; judge it once
                  seen.add(doc)
                  if p.get("status") != "live":
                      print(f"- {doc}: puzzle not live; skipping")
                      continue
                  if cta.get("final_rule_url"):
                      print(f"- {doc}: final rule published; retired from the watch list")
                      continue
                  dl = cta.get("comment_deadline")
                  if dl:
                      try:
                          d = datetime.fromisoformat(dl)
                          if d.tzinfo is None:
                              d = d.replace(tzinfo=timezone.utc)
                          age = (now - d).days
                          if age > GRACE_DAYS:
                              print(f"- {doc}: closed {age}d ago (> {GRACE_DAYS}d grace); retired")
                              continue
                      except ValueError:
                          print(f"::warning::{doc}: unparseable comment_deadline {dl!r}; watching anyway")
                  out.append(doc)
              return out

          TRACKED = watch_list()

          if not TRACKED:
              print("Nothing to watch — no live docket is open or inside its grace window.")
              sys.exit(0)

          if not KEY:
              # A warning, not a failure: a missing optional key shouldn't red-X
              # this repo every morning. Counts simply stop updating.
              print("::warning::REGULATIONS_GOV_API_KEY is not set — leaving JSON untouched.")
              sys.exit(0)

          print(f"Watching {len(TRACKED)} docket(s): {', '.join(TRACKED)}")

          def get_json(url):
              req = urllib.request.Request(url, headers={"X-Api-Key": KEY})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          # Load existing data; on any read error start from empty but never lose entries silently.
          try:
              with open(PATH) as f:
                  data = json.load(f)
              if not isinstance(data, dict):
                  data = {}
          except FileNotFoundError:
              data = {}
          except Exception as e:
              print(f"::warning::Could not parse {PATH} ({e}); starting from empty.")
              data = {}

          changed = False
          for doc_id in TRACKED:
              try:
                  # 1) documentId -> objectId
                  doc = get_json(f"{API}/documents/{urllib.parse.quote(doc_id)}")
                  object_id = doc["data"]["attributes"]["objectId"]

                  # 2) objectId -> posted comment count (meta.totalElements)
                  q = urllib.parse.urlencode({"filter[commentOnId]": object_id})
                  comments = get_json(f"{API}/comments?{q}")
                  posted = int(comments["meta"]["totalElements"])

                  prev = (data.get(doc_id) or {}).get("posted")
                  data[doc_id] = {
                      "posted": posted,
                      "updated": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  }
                  if prev != posted:
                      changed = True
                  print(f"{doc_id}: posted={posted} (was {prev})")
                  time.sleep(1)  # be polite to the API between docs
              except (urllib.error.HTTPError, urllib.error.URLError, KeyError, ValueError, TimeoutError) as e:
                  # FAIL SOFT: leave this doc's existing entry untouched. Never write null/0.
                  print(f"::warning::{doc_id} fetch failed ({e}); keeping previous value.")
                  continue

          if changed:
              with open(PATH, "w") as f:
                  json.dump(data, f, indent=2, sort_keys=True)
                  f.write("\n")
              print("Updated", PATH)
          else:
              print("No changes.")
          PY

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain data/comment-counts.json)" ]]; then
            git config user.name "moralfibermedia"
            git config user.email "mf@moralfibermedia.com"
            git add data/comment-counts.json
            git commit -m "chore: refresh comment counts [skip ci]"
            git push
          else
            echo "Nothing to commit."
          fi
