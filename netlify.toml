[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

# Friendly private URL for the puzzle stats dashboard (function-backed)
[[redirects]]
  from = "/review/stats"
  to = "/.netlify/functions/stats"
  status = 200

# Operator console for the Dream Ticket poll (key verified server-side)
[[redirects]]
  from = "/review/poll-admin"
  to = "/.netlify/functions/poll-admin"
  status = 200

# Exception: the live comment-count feed for the Public Comment CTA must be
# fetchable client-side. Listed BEFORE the /data/* block so it wins (first match).
# The v1 arcade archive and the /compare/ design lab were retired in
# October 2026. Each archived page 301s to its live equivalent; the
# comparison hub goes to the puzzle index. Permanent, hence 301.

[[redirects]]
  from = "/v1/americas-250th/*"
  to = "/puzzles/americas-250th/"
  status = 301

[[redirects]]
